<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MALAND RTS - لعبة استراتيجية زمن حقيقي</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="stylesheet" href="assets/css/lobby.css">
  
  <style>
    body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Main App Container -->
  <div id="app"></div>

  <!-- Scripts -->
  <script type="module">
    import { Logger, Storage } from './assets/js/utils/helpers.js';
    import { authManager } from './assets/js/auth/auth.js';
    import { LoginUI } from './assets/js/ui/login.js';
    import { LobbyUI } from './assets/js/ui/lobby.js';

    // ====== App Manager ======
    class App {
      constructor() {
        this.currentScreen = null;
        this.loginUI = null;
        this.lobbyUI = null;
        this.init();
      }

      async init() {
        Logger.log('🎮 MALAND RTS initializing...');
        
        // Check if user is already logged in
        if (authManager.isLoggedIn()) {
          this.showLobby();
        } else {
          this.showLogin();
        }
        
        // Listen to auth events
        authManager.on('login', (user) => this.onLogin(user));
        authManager.on('logout', () => this.showLogin());
      }

      showLogin() {
        Logger.log('📝 Showing login screen');
        this.currentScreen = 'login';
        this.loginUI = new LoginUI();
        this.loginUI.render();
        this.loginUI.on('loginSuccess', (user) => this.onLogin(user));
      }

      showLobby() {
        Logger.log('🎮 Showing lobby screen');
        this.currentScreen = 'lobby';
        this.lobbyUI = new LobbyUI();
        this.lobbyUI.render();
        
        // Setup lobby listeners
        this.lobbyUI.on('gameStart', (settings) => this.onGameStart(settings));
        this.lobbyUI.on('cancel', () => this.showLobby());
        this.lobbyUI.on('logout', () => this.showLogin());
      }

      onLogin(user) {
        Logger.success(`✅ User logged in: ${user.username}`);
        setTimeout(() => this.showLobby(), 800);
      }

      onGameStart(settings) {
        Logger.log('🎮 Game starting with settings:', settings);
        alert('🎮 اللعبة ستبدأ قريباً!\n' + 
              `الخريطة: ${settings.map}\n` +
              `عدد اللاعبين: ${settings.players.length}\n` +
              'هذه نسخة تجريبية');
      }
    }

    // ====== Initialize App ======
    const app = new App();

    // Make app globally accessible
    window.app = app;

    // ====== Keyboard Shortcuts ======
    document.addEventListener('keydown', (e) => {
      // Alt + L for logout (development)
      if (e.altKey && e.key === 'l') {
        authManager.logout();
      }
    });

    Logger.success('✅ MALAND RTS Ready!');
  </script>
</body>
</html>
